name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "Using $SDKM"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "platforms;android-28" "ndk;28.2.13676358"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build package
        shell: pwsh
        run: ./scripts/package.ps1 -Abi arm64-v8a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: color-grade
          path: build-*/*.levipack

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-*/*.levipack
